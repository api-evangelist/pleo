openapi: 3.2.0
info:
  title: Pleo Accounts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://pleo.io/terms/
  version: '1.0'
  description: 'Operations tagged Accounts across 2 of this provider''s published API definitions: pleo-bookkeeping-core-openapi.yml, pleo-chart-of-accounts-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://external.pleo.io
  description: Production server
- url: https://external.staging.pleo.io
  description: Staging server
tags:
- name: Accounts
  description: 'This API enables you to create an account in Pleo, search for an account by its specific ID, update details of an account recorded in Pleo, delete an account from Pleo, or apply specific filters to retrieve a list of accounts managed in Pleo.


    💡**Note**


    Please note that only response codes specific to the API behaviour are documented. Otherwise, we follow HTTP response codes.'
paths:
  /v1-beta/accounts:
    post:
      tags:
      - Accounts
      summary: Create a new account
      description: 'The integration sends a request to this endpoint to create a corresponding account in Pleo for any

        new record created in the external ERP/accounting system. The request fails if any similar accounts with

        the same `externalId` and `companyId` already exists in Pleo.'
      operationId: createAccountV4
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/BookkeepingAccountCreateRequestV4'
        required: true
      responses:
        '200':
          description: Request matched existing account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseBookkeepingAccountRestModelV4'
              example:
                data:
                  archived: false
                  code: '2001'
                  companyId: 123e4567-e89b-12d3-a456-426614174006
                  externalId: External Id
                  id: 123e4567-e89b-12d3-a456-426614174005
                  name: Bank Charges
                  taxCodeExternalId: IVA 20
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseBookkeepingAccountRestModelV4'
              example:
                data:
                  archived: false
                  code: '2001'
                  companyId: 123e4567-e89b-12d3-a456-426614174006
                  externalId: External Id
                  id: 123e4567-e89b-12d3-a456-426614174005
                  name: Bank Charges
                  taxCodeExternalId: IVA 20
        '400':
          description: Bad request (e.g. missing required fields).
        '409':
          description: "\n                    Conflict (account with the same `externalId` exists in Pleo)\n                "
      security:
      - bearerAuth: []
    servers:
    - url: https://external.pleo.io
      description: Production server
    - url: https://external.staging.pleo.io
      description: Staging server
  /v1-beta/accounts/{accountId}:
    get:
      tags:
      - Accounts
      summary: Retrieves an account in Pleo by its ID
      description: Search for a specific account by its account ID.
      operationId: getAccountV4
      parameters:
      - name: accountId
        in: path
        description: ID of the account to retrieve.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174015
      responses:
        '200':
          description: Retrieval of account successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseBookkeepingAccountRestModelV4'
              example:
                data:
                  archived: false
                  code: '2001'
                  companyId: 123e4567-e89b-12d3-a456-426614174006
                  externalId: External Id
                  id: 123e4567-e89b-12d3-a456-426614174005
                  name: Bank Charges
                  taxCodeExternalId: IVA 20
        '404':
          description: Account not found.
      security:
      - bearerAuth: []
    put:
      tags:
      - Accounts
      summary: Update an account
      description: 'Update details of an existing account in Pleo. The integration must send a request to this endpoint

        when it is trying to archive an account linked to accounting entries.'
      operationId: updateAccountV4
      parameters:
      - name: accountId
        in: path
        description: ID of the account to update.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174015
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/BookkeepingAccountUpdateRequestV4'
        required: true
      responses:
        '200':
          description: Update of account successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseBookkeepingAccountRestModelV4'
              example:
                data:
                  archived: false
                  code: '2001'
                  companyId: 123e4567-e89b-12d3-a456-426614174006
                  externalId: External Id
                  id: 123e4567-e89b-12d3-a456-426614174005
                  name: Bank Charges
                  taxCodeExternalId: IVA 20
        '400':
          description: Bad request (e.g. missing required fields, tax code does not exist in Pleo).
        '404':
          description: Account not found.
      security:
      - bearerAuth: []
    delete:
      tags:
      - Accounts
      summary: Delete an account
      description: 'Deletes an existing account in Pleo.


        Only accounts not linked to any accounting entries can be deleted. Trying to delete an account linked to accounting entries will result in an error. If an account is linked, it can be archived instead. Use UPDATE endpoint to archive an account.'
      operationId: deleteAccountV4
      parameters:
      - name: accountId
        in: path
        description: ID of the account to delete.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174015
      responses:
        '204':
          description: Deletion of account successful.
        '404':
          description: Account not found.
        '409':
          description: Account linked to accounting entries and cannot be deleted. Use UPDATE endpoint to archive the account.
      security:
      - bearerAuth: []
    servers:
    - url: https://external.pleo.io
      description: Production server
    - url: https://external.staging.pleo.io
      description: Staging server
  /v1-beta/accounts:search:
    post:
      tags:
      - Accounts
      summary: Fetch a list of accounts
      description: Retrieves a list of accounts with optional filters for companyId, ids, name, code and archived status. Results are paginated.
      operationId: searchAccountsV4
      parameters:
      - name: before
        in: query
        description: Lower bound of the page of data to return (cannot be used together with [after] or [offset])
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: after
        in: query
        description: Upper bound of the page of data to return (cannot be used together with [before] or [offset])
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: offset
        in: query
        description: Offset of the page of data to return (cannot be used together with [before] or [after])
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: The maximum amount of items to return
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: sorting_keys
        in: query
        description: The keys to sort the results by
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: sorting_order
        in: query
        description: The order to sort the results by. Must be the same length as [sortingKeys]; one order per key
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PageOrder'
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/BookkeepingAccountSearchRequestV4'
        required: true
      responses:
        '200':
          description: Fetch of accounts successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaginatedResponseBookkeepingAccountRestModelV4'
              example:
                data:
                - accountingSystem: xero
                  archived: false
                  code: '2001'
                  companyId: 123e4567-e89b-12d3-a456-426614174006
                  externalId: External Id
                  id: 123e4567-e89b-12d3-a456-426614174005
                  name: Bank Charges
                  taxCodeExternalId: IVA 20
                pagination:
                  currentRequestPagination:
                    parameters: {}
                  endCursor: string
                  hasNextPage: true
                  hasPreviousPage: true
                  startCursor: string
                  total: 1
        '400':
          description: Bad request (e.g. missing required fields, tax code does not exist in Pleo).
      security:
      - bearerAuth: []
    servers:
    - url: https://external.pleo.io
      description: Production server
    - url: https://external.staging.pleo.io
      description: Staging server
  /v1/chart-of-accounts:
    post:
      tags:
      - Accounts
      summary: Create a new account
      description: 'The integration sends a request to this endpoint to create a corresponding account in Pleo for any new record created in the external ERP/accounting system.

        The request will fail if an account with the same `externalId` and `companyId` already exists in Pleo.'
      operationId: createAccountV1
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/BookkeepingAccountCreateRequestV1'
        required: true
      responses:
        '200':
          description: Request matched existing account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseBookkeepingAccountRestModelV1'
              example:
                data:
                  archived: false
                  code: '2001'
                  companyId: 123e4567-e89b-12d3-a456-426614174006
                  externalId: External Id
                  id: 123e4567-e89b-12d3-a456-426614174005
                  name: Bank Charges
                  taxCodeExternalId: IVA 20
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseBookkeepingAccountRestModelV1'
              example:
                data:
                  archived: false
                  code: '2001'
                  companyId: 123e4567-e89b-12d3-a456-426614174006
                  externalId: External Id
                  id: 123e4567-e89b-12d3-a456-426614174005
                  name: Bank Charges
                  taxCodeExternalId: IVA 20
        '400':
          description: 'Bad request: for example, missing required fields.'
        '409':
          description: 'Conflict: account with the same `externalId` exists in Pleo.'
      security:
      - bearerAuth: []
      - basicAuth: []
    servers:
    - url: https://external.pleo.io
      description: Production server
    - url: https://external.staging.pleo.io
      description: Staging server
  /v1/chart-of-accounts/batch:
    post:
      tags:
      - Accounts
      summary: Create multiple accounts in a single request
      description: 'Creates multiple bookkeeping accounts in a single batch operation.

        This endpoint validates each account in the batch and returns both successfully created accounts and failed items with their failure reasons.

        Accounts that pass validation will be created, while invalid accounts will be returned in the failed list.'
      operationId: createAccountsBatchV1
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/BookkeepingAccountBatchCreateRequestV1'
        required: true
      responses:
        '201':
          description: Batch creation completed. Check the response for created and failed items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseBookkeepingAccountBatchCreateResponseV1'
              example:
                data:
                  created:
                  - archived: false
                    code: '2001'
                    companyId: 123e4567-e89b-12d3-a456-426614174006
                    externalId: ext-001
                    id: 123e4567-e89b-12d3-a456-426614174005
                    name: Bank Charges
                    taxCodeExternalId: IVA 20
                  - archived: false
                    code: '2002'
                    companyId: 123e4567-e89b-12d3-a456-426614174006
                    externalId: ext-002
                    id: 123e4567-e89b-12d3-a456-426614174007
                    name: Office Supplies
                    taxCodeExternalId: IVA 20
                  failed:
                  - reasons:
                    - EXTERNAL_ID_ALREADY_EXISTS
                    - NAME_EMPTY
                    request:
                      archived: false
                      code: '2003'
                      externalId: ext-duplicate
                      name: ''
                      taxCodeExternalId: IVA 20
        '400':
          description: 'Bad request: for example, batch size outside allowed range, missing required fields or contains invalid input.'
      security:
      - bearerAuth: []
      - basicAuth: []
    servers:
    - url: https://external.pleo.io
      description: Production server
    - url: https://external.staging.pleo.io
      description: Staging server
  /v1/chart-of-accounts/{accountId}:
    get:
      tags:
      - Accounts
      summary: Retrieve an account in Pleo by its ID
      description: Search for a specific account by its ID.
      operationId: getAccountV1
      parameters:
      - name: accountId
        in: path
        description: ID of the account to retrieve.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174015
      responses:
        '200':
          description: Retrieval of account successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseBookkeepingAccountRestModelV1'
              example:
                data:
                  archived: false
                  code: '2001'
                  companyId: 123e4567-e89b-12d3-a456-426614174006
                  externalId: External Id
                  id: 123e4567-e89b-12d3-a456-426614174005
                  name: Bank Charges
                  taxCodeExternalId: IVA 20
        '404':
          description: Account not found.
      security:
      - bearerAuth: []
      - basicAuth: []
    put:
      tags:
      - Accounts
      summary: Update an account
      description: 'Update details of an existing account in Pleo.

        The integration must send a request to this endpoint when it is trying to archive an account linked to accounting entries.'
      operationId: updateAccountV1
      parameters:
      - name: accountId
        in: path
        description: ID of the account to update.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174015
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/BookkeepingAccountUpdateRequestV1'
        required: true
      responses:
        '200':
          description: Update of account successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseBookkeepingAccountRestModelV1'
              example:
                data:
                  archived: false
                  code: '2001'
                  companyId: 123e4567-e89b-12d3-a456-426614174006
                  externalId: External Id
                  id: 123e4567-e89b-12d3-a456-426614174005
                  name: Bank Charges
                  taxCodeExternalId: IVA 20
        '400':
          description: 'Bad request: for example, missing required fields, tax code does not exist in Pleo.'
        '404':
          description: Account not found.
      security:
      - bearerAuth: []
      - basicAuth: []
    delete:
      tags:
      - Accounts
      summary: Delete an account
      description: 'Deletes an existing account in Pleo.


        Only accounts not linked to any accounting entries can be deleted. Trying to delete an account linked to accounting entries will result in an error. If an account is linked, it can only be archived. Use UPDATE endpoint to archive an account.'
      operationId: deleteAccountV1
      parameters:
      - name: accountId
        in: path
        description: ID of the account to delete.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174015
      responses:
        '204':
          description: Deletion of account successful.
        '404':
          description: Account not found.
        '409':
          description: Account linked to accounting entries and cannot be deleted. Use UPDATE endpoint to archive the account.
      security:
      - bearerAuth: []
      - basicAuth: []
    servers:
    - url: https://external.pleo.io
      description: Production server
    - url: https://external.staging.pleo.io
      description: Staging server
  /v1/chart-of-accounts:search:
    post:
      tags:
      - Accounts
      summary: Fetch a list of accounts
      description: Retrieves a list of accounts with companyId and other optional filters. Results are paginated.
      operationId: searchAccountsV1
      parameters:
      - name: before
        in: query
        description: Lower bound of the page of data to return (cannot be used together with [after] or [offset]).
        required: false
        style: form
        explode: true
        schema:
          pattern: ^[A-Z2-7=~]+$
          type: string
      - name: after
        in: query
        description: Upper bound of the page of data to return (cannot be used together with [before] or [offset]).
        required: false
        style: form
        explode: true
        schema:
          pattern: ^[A-Z2-7=~]+$
          type: string
      - name: offset
        in: query
        description: Offset of the page of data to return (cannot be used together with [before] or [after]).
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: The maximum amount of items to return.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: sorting_keys
        in: query
        description: The keys to sort the results by.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: sorting_order
        in: query
        description: The order to sort the results by. Must be the same length as [sortingKeys]; one order per key.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PageOrder'
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/BookkeepingAccountSearchRequestV1'
        required: true
      responses:
        '200':
          description: Retrieval of accounts successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaginatedResponseBookkeepingAccountRestModelV1'
              example:
                data:
                - accountingSystem: xero
                  archived: false
                  code: '2001'
                  companyId: 123e4567-e89b-12d3-a456-426614174006
                  externalId: External Id
                  id: 123e4567-e89b-12d3-a456-426614174005
                  name: Bank Charges
                  taxCodeExternalId: IVA 20
                pagination:
                  currentRequestPagination:
                    parameters: {}
                  endCursor: string
                  hasNextPage: true
                  hasPreviousPage: true
                  startCursor: string
                  total: 1
        '400':
          description: 'Bad request: for example, missing required fields, tax code does not exist in Pleo.'
      security:
      - bearerAuth: []
      - basicAuth: []
    servers:
    - url: https://external.pleo.io
      description: Production server
    - url: https://external.staging.pleo.io
      description: Staging server
components:
  schemas:
    BookkeepingAccountRestModelV4:
      required:
      - archived
      - companyId
      - externalId
      - id
      - name
      type: object
      properties:
        archived:
          type: boolean
          description: Boolean flag used to determine if the account is archived.
        code:
          type:
          - string
          - 'null'
          description: Account code or number used in the accounting system's chart of accounts.
        companyId:
          type: string
          description: Pleo's internal identifier of the company the account is associated with.
          format: uuid
        externalId:
          type: string
          description: "\n            Unique external identifier of account, assigned in the external ERP/accounting system. \n            Can be the same as code if no other identifier is available.\n        "
        id:
          type: string
          description: Pleo's internal identifier of the account.
          format: uuid
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - object
            - 'null'
            description: Place for API users to store flexible data.
          description: Place for API users to store flexible data.
        name:
          type: string
          description: Name of the account.
        taxCodeExternalId:
          type:
          - string
          - 'null'
          description: 'The identifier in **the target system** for the tax code the account is associated with. '
      description: Represents an account in Pleo.
    DataResponseBookkeepingAccountRestModelV4:
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BookkeepingAccountRestModelV4'
    BookkeepingAccountCreateRequestV4:
      required:
      - archived
      - companyId
      - externalId
      - name
      type: object
      properties:
        archived:
          type: boolean
          description: Boolean flag used to determine if the account is archived.
        code:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Account code or number used in the accounting system's chart of accounts.
        companyId:
          type: string
          description: Pleo's internal identifier for the company the account is associated with.
          format: uuid
        externalId:
          maxLength: 255
          minLength: 0
          type: string
          description: "\n            Unique external identifier of account, assigned in the external ERP/accounting system. \n            Can be the same as code if no other identifier is available.\n        "
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - object
            - 'null'
            description: Place for API users to store flexible data.
          description: Place for API users to store flexible data.
        name:
          maxLength: 255
          minLength: 0
          type: string
          description: Name of the account.
        taxCodeExternalId:
          type:
          - string
          - 'null'
          description: "\n            The identifier in **the target system** for the tax code the account is associated with.\n            - This is NOT the tax percentage (e.g. 20%)\n            - This is NOT the Pleo UUID of the tax code\n        "
    CursorPageInfo:
      required:
      - currentRequestPagination
      - hasNextPage
      - hasPreviousPage
      type: object
      properties:
        currentRequestPagination:
          $ref: '#/components/schemas/CursorPageCurrentRequestInfo'
        endCursor:
          type: string
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
        startCursor:
          type: string
        total:
          type: integer
          format: int64
    BookkeepingAccountUpdateRequestV4:
      required:
      - archived
      - name
      type: object
      properties:
        archived:
          type: boolean
          description: Boolean flag used to determine if the account is archived.
        code:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Account code or number used in the accounting system's chart of accounts.
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - object
            - 'null'
            description: Place for API users to store flexible data.
          description: Place for API users to store flexible data.
        name:
          maxLength: 255
          minLength: 0
          type: string
          description: Name of the account.
        taxCodeExternalId:
          type:
          - string
          - 'null'
          description: "\n            The identifier in **the target system** for the tax code the account is associated with.\n            - This is NOT the tax percentage (e.g. 20%)\n            - This is NOT the Pleo UUID of the tax code\n        "
      description: Represents a request to update an account.
    BookkeepingAccountSearchRequestV4:
      required:
      - companyId
      type: object
      properties:
        archived:
          type:
          - boolean
          - 'null'
          description: Filter by archived status.
          example: false
        code:
          type:
          - string
          - 'null'
          description: Search by code.
          example: '2001'
        companyId:
          type: string
          description: Filter by company ID.
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174011
        externalId:
          type:
          - string
          - 'null'
          description: Search by external id.
          example: 123e4567-e89b-12d3-a456-426614174011
        ids:
          uniqueItems: true
          type:
          - array
          - 'null'
          description: Filter by a list of account IDs.
          items:
            type:
            - string
            - 'null'
            description: Filter by a list of account IDs.
            format: uuid
        name:
          type:
          - string
          - 'null'
          description: Search by name.
          example: Bank Charges
      description: Represents a request to search for accounts.
    CursorPaginatedResponseBookkeepingAccountRestModelV4:
      required:
      - data
      - pagination
      type: object
      properties:
        data:
          type: array
