description: >
  Pleo is a business spend management platform that issues smart company cards
  to employees, enabling real-time expense tracking, receipt capture, and
  automated bookkeeping. The Pleo REST API lets developers automate workflows,
  sync accounting data, manage users and cards, and build custom integrations
  against accounting systems. The API supports OAuth 2.0 (with PKCE) and API
  key authentication with a scopes-based permission model, and offers both
  a sandbox and production environment. Pleo also runs an App Marketplace
  where partners can publish integrations available to thousands of businesses
  across Europe.
