    ExportJob:
      required:
      - companyId
      - createdAt
      - expiresIn
      - id
      - isInteractive
      - numberOfItems
      - status
      - vendorBasedBookkeeping
      type: object
      properties:
        companyId:
          type: string
          description: The Pleo unique identifier of the company the export job belongs
            to.
          format: uuid
        completedAt:
          pattern: YYYY-MM-DDTHH:mi:ssZ
          type: string
          description: Date and time when the export job was completed.
          format: date-time
          nullable: true
        createdAt:
          pattern: YYYY-MM-DDTHH:mi:ssZ
          type: string
          description: Date and time when the export job was initiated by the user,
            that is, when the user clicked the Export button in the Pleo application.
          format: date-time
        createdBy:
          type: string
          description: This is the Pleo unique identifier of the user that initiated
            the export job.
          format: uuid
          nullable: true
          default: null
        expiredAt:
          pattern: YYYY-MM-DDTHH:mi:ssZ
          type: string
          description: Date and time when the export job expired.
          format: date-time
          nullable: true
        expiresIn:
          type: integer
          description: This is the time specified in seconds when the job would expire;
            this is calculated since the last action performed on the job. The last
            time an action was taken on the job is reflected in the lastUpdatedAt
            attribute.
          format: int32
        failureReason:
          type: string
          description: Reason why the job failed in the case of a failure.
          nullable: true
        failureReasonType:
          type: string
          description: The classification for the failure from a list of described
            failure reason types.
          nullable: true
          enum:
          - invalid_configuration
          - missing_configuration
          - authentication_failure
          - accounting_system_authentication_failure
          - pleo_rate_limit
          - accounting_system_rate_limit
          - service_unreachable
          - accounting_system_unreachable
          - validation_failure
          - authorization_failure
          - integration_unusable
          - job_expired
          - service_timeout
          - accounting_system_timeout
          - canceled_by_user
        id:
          type: string
          description: The unique identifier generated by Pleo for the export job.
          format: uuid
        isInteractive:
          type: boolean
          description: Indicates whether the export job was initiated by a user or
            by the system.
        lastUpdatedAt:
          pattern: YYYY-MM-DDTHH:mi:ssZ
          type: string
          description: Last time the job was updated or action on the job was taken.
          format: date-time
          nullable: true
        numberOfItems:
          type: integer
          description: Number of accounting entries that were selected for processing.
        startedAt:
          pattern: YYYY-MM-DDTHH:mi:ssZ
          type: string
          description: Date and time when the export job was started - this indicates
            the time when the export job event was triggered to change the status
            of the export job to in_progress.
          format: date-time
          nullable: true
        status:
          type: string
          description: Specifies the current execution state of the export job. Some
            here are the definitions of the values that are supported for this field.
          enum:
          - pending
          - in_progress
          - failed
          - completed
          - completed_with_errors
        vendorBasedBookkeeping:
          type: boolean
          description: When enabled, the export items would include vendor and bookkeeping
            data
    ExportJobEventType:
      type: string
      description: '

        | Value  | Description |

        | ------ | ----------- |

        | started | The integration has started processing the job. |

        | failed | The job has failed due to a connection error, authentication failure,
        or similar issue. |

        | completed | The job has been successfully processed. |

        | completed_with_errors | The job has been completed, but only some accounting
        entries were exported successfully. |'
      enum:
      - started
      - failed
      - completed
      - completed_with_errors
    ExportJobFailureReasonType:
      type: string
      description: '

        | Value  | Description |

        | ------ | ----------- |

        | invalid_configuration | This would define a failure reason pertaining to
        invalid configuration needed to complete the export job or interact with the
        accounting system. |

        | missing_configuration | This would define a failure reason pertaining to
        incomplete configuration needed to complete the export job or interact with
        the accounting system. |

        | authentication_failure | Pleo API failed to authenticate with the integration
        service when sending off a WebHook API call. |

        | accounting_system_authentication_failure | Integration service could not
        authenticate with the accounting system. |

        | pleo_rate_limit | Irrecoverable rate limit issue with Pleo API. |

        | accounting_system_rate_limit | Irrecoverable rate limit issue with the accounting
        system. |

        | service_unreachable | Integration service unreachable. |

        | accounting_system_unreachable | Integration service unable to reach accounting
        system. |

        | validation_failure | Irrecoverable validation error making the job unprocessable.
        |

        | authorization_failure | Authorisation revoked or user no longer has access
        in the accounting system. |

        | integration_unusable | Integration service blocked or unusable for the customer.
        |

        | job_expired | Job not updated within expiry time limit. |

        | service_timeout | Irrecoverable timeout communicating with integration service.
        |

        | accounting_system_timeout | Irrecoverable timeout communicating with accounting
        system. |

        | canceled_by_user | Job was canceled by user. |'
      enum:
      - invalid_configuration
      - missing_configuration
      - authentication_failure
      - accounting_system_authentication_failure
      - pleo_rate_limit
      - accounting_system_rate_limit
      - service_unreachable
      - accounting_system_unreachable
      - validation_failure
      - authorization_failure
      - integration_unusable
      - job_expired
      - service_timeout
      - accounting_system_timeout
      - canceled_by_user
    ExportJobItem:
      required:
      - accountingEntryId
      - exportJobId
      - status
      type: object
      properties:
        accountingEntryId:
          type: string
          description: The accounting entry identifier being exported.
          format: uuid
        exportJobId:
          type: string
          description: The export job identifier for which this item belongs to.
          format: uuid
        exportedAt:
          pattern: YYYY-MM-DDTHH:mi:ssZ
          type: string
          description: Date and time the item was exported.
          format: date-time
          nullable: true
        externalId:
          type: string
          description: This is an external identifier of the corresponding accounting
            entry in the accounting system after export.
          nullable: true
        externalUrl:
          type: string
          description: This is the external URL pointing to the accounting entry resource
            in the accounting system after the export.
          nullable: true
        failureReason:
          type: string
          description: Reason why the export of this item failed in the case of a
            failure.
          nullable: true
        failureReasonType:
          type: string
          description: The classification for the failure from a list of described
            failure reason types.
          nullable: true
          enum:
          - receipt_upload_failure
          - receipt_download_failure
          - receipt_file_size_limit_exceeded
          - receipt_conversion_failure
          - unexpected_failure
          - invalid_configuration
          - missing_configuration
          - accounting_system_authentication_failure
          - accounting_system_rate_limit
          - accounting_system_unreachable
          - validation_failure
          - accounting_system_validation_failure
          - authorization_failure
          - accounting_system_timeout
        status:
          type: string
          description: Status of the export job Item after being processed. The status
            of the export job item is null until an attempt has been made to process
            the export job item.
          enum:
          - pending
          - in_progress
          - failed
          - successful
          - abandoned
    ExportJobItemFailureReasonType:
      type: string
      description: '

        | Value  | Description |

        | ------ | ----------- |

        | receipt_upload_failure | An error occurred while uploading the receipt file
        to the accounting system. |

        | receipt_download_failure | An error occurred while downloading the receipt
        file from Pleo. |

        | receipt_file_size_limit_exceeded | If the receipt file size has exceeded
        the limit specified by the accounting system. |

        | receipt_conversion_failure | When an attempt to convert the receipt to a
        different file type and the conversion failed. |

        | unexpected_failure | An unexpected error occurred. |

        | invalid_configuration | This would define a failure reason pertaining to
        invalid configuration needed to complete the export of the item or interact
        with the accounting system. |

        | missing_configuration | This would define a failure reason pertaining to
        incomplete configuration needed to complete the export of the item or interact
        with the accounting system. |

        | accounting_system_authentication_failure | The integration service could
        not authenticate with the accounting system. |

        | accounting_system_rate_limit | There was an irrecoverable rate limit issue
        that the integration service encountered at any stage of the export job process
        while communicating with the accounting system. |

        | accounting_system_unreachable | This would be an error that occurs if the
        integration service is unable to reach the accounting system. |

        | validation_failure | If there was an irrecoverable validation error that
        occurred while validating the export item. |

        | accounting_system_validation_failure | If there was an irrecoverable validation
        error encountered by the accounting system as a result of exporting the item.
        |

        | authorization_failure | This is an error that may have occurred because
        the authorization granted with the token that was generated during the installation
        of the integration, has been revoked or the user that authorized no longer
        has that access in the accounting system. |

        | accounting_system_timeout | This would be an error that occurs if the integration
        service encounters an irrecoverable timeout while communicating with the accounting
        system. |

        | vendor_unknown | Failure due to unknown or invalid vendor account number
        in the accounting system at time of exporting the item. |

        | account_unknown | Failure due to unknown or invalid account number in the
        accounting system at time of exporting the item. |

        | tax_code_unknown | Failure due to unknown or invalid tax code in the accounting
        system at time of exporting the item. |

        | tag_unknown | Failure due to unknown or invalid tag in the accounting system
        at time of exporting the item. |'
      enum:
      - receipt_upload_failure
      - receipt_download_failure
      - receipt_file_size_limit_exceeded
      - receipt_conversion_failure
      - unexpected_failure
      - invalid_configuration
      - missing_configuration
      - accounting_system_authentication_failure
      - accounting_system_rate_limit
      - accounting_system_unreachable
      - validation_failure
      - accounting_system_validation_failure
      - authorization_failure
      - accounting_system_timeout
      - vendor_unknown
      - account_unknown
      - tax_code_unknown
      - tag_unknown
    ExportJobItemStatus:
      type: string
      description: '

        | Value  | Description |

        | ------ | ----------- |

        | pending | The export job item is selected for export, yet it is waiting
        to be exported. |

        | in_progress | The export job item is currently being exported to the ERP/accounting
        system. |

        | failed | The export job item could not be exported to the ERP/accounting
        system. |

        | successful | The export job item is successfully exported to the ERP/accounting
        system. |

        | abandoned | The export job item could not be exported to the ERP/accounting
        system because the export job could not be completed. |'
      enum:
      - pending
      - in_progress
      - failed
      - successful
      - abandoned
    ExportJobItemUpdate:
      required:
      - data
      - errors
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExportJobItem'
        errors:
          type: array
          description: If any errors occurred in updating the export job items, they
            will be listed here.
          items:
            $ref: '#/components/schemas/ExportJobItemUpdateError'
    ExportJobItemUpdateError:
      required:
      - accountingEntryId
      - message
      - type
      type: object
      properties:
        accountingEntryId:
          type: string
          description: Accounting entry ID for which this error occurred.
          format: uuid
        message:
          type: string
          description: Descriptive error message.
        type:
          type: string
          description: Descriptive error type.
          enum:
          - ACCOUNTING_ENTRY_DOES_NOT_EXIST
          - EXPORT_ENTRY_STATUS_UPDATE_FAILED
          - ACCOUNTING_ENTRY_UPDATE_FAILED
      description: If any errors occurred in updating the export job items, they will
        be listed here.
    ExportJobItemUpdateErrorType:
      type: string
      description: '

        | Value  | Description |

        | ------ | ----------- |

        | ACCOUNTING_ENTRY_DOES_NOT_EXIST | Accounting entry does not exist. |

        | EXPORT_ENTRY_STATUS_UPDATE_FAILED | Export entry does not exist. |

        | ACCOUNTING_ENTRY_UPDATE_FAILED | Export entry status update failed. |'
      enum:
      - ACCOUNTING_ENTRY_DOES_NOT_EXIST
      - EXPORT_ENTRY_STATUS_UPDATE_FAILED
      - ACCOUNTING_ENTRY_UPDATE_FAILED
    ExportJobItemUpdateErrorV3:
      required:
      - accountingEntryId
      - message
      - type
      type: object
      properties:
        accountingEntryId:
          type: string
          description: Accounting entry ID for which this error occurred.
          format: uuid
        message:
          type: string
          description: Descriptive error message.
        type:
          type: string
          description: This can be one of ExportJobItemUpdateErrorType values
          example: ACCOUNTING_ENTRY_DOES_NOT_EXIST
      description: If any errors occurred in updating the export job items, they will
        be listed here.
    ExportJobItemUpdateV3:
      required:
      - data
      - errors
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExportJobItemV3'
        errors:
          type: array
          description: If any errors occurred in updating the export job items, they
            will be listed here.
          items:
            $ref: '#/components/schemas/ExportJobItemUpdateErrorV3'
    ExportJobItemV3:
      required:
      - accountingEntryId
      - exportJobId
      - status
      type: object
      properties:
        accountingEntryId:
          type: string
          description: The accounting entry identifier being exported.
          format: uuid
        exportJobId:
          type: string
          description: The export job identifier for which this item belongs to.
          format: uuid
        exportedAt:
          pattern: YYYY-MM-DDTHH:mi:ssZ
          type: string
          description: Date and time the item was exported.
          format: date-time
          nullable: true
        externalId:
          type: string
          description: This is an external identifier of the corresponding accounting
            entry in the accounting system after export.
          nullable: true
        externalUrl:
          type: string
          description: This is the external URL pointing to the accounting entry resource
            in the accounting system after the export.
          nullable: true
        failureReason:
          type: string
          description: Reason why the export of this item failed in the case of a
            failure.
          nullable: true
        failureReasonType:
          type: string
          description: This can be one of ExportJobItemFailureReasonType values
          example: receipt_upload_failure
        status:
          type: string
          description: This can be one of ExportJobItemStatus values
          example: pending
    ExportJobStatus:
      type: string
      enum:
      - pending
      - in_progress
      - failed
      - completed
      - completed_with_errors
    ExportJobV3:
      required:
      - companyId
      - createdAt
      - expiresIn
      - id
      - isInteractive
      - numberOfItems
      - status
      - vendorBasedBookkeeping
      type: object
      properties:
        companyId:
          type: string
          description: The Pleo unique identifier of the company the export job belongs
            to.
          format: uuid
        completedAt:
          pattern: YYYY-MM-DDTHH:mi:ssZ
          type: string
          description: Date and time when the export job was completed.
          format: date-time
          nullable: true
        createdAt:
          pattern: YYYY-MM-DDTHH:mi:ssZ
          type: string
          description: Date and time when the export job was initiated by the user,
            that is, when the user clicked the Export button in the Pleo application.
          format: date-time
        createdBy:
          type: string
          description: This is the Pleo unique identifier of the user that initiated
            the export job.
          format: uuid
          nullable: true
          default: null
        expiredAt:
          pattern: YYYY-MM-DDTHH:mi:ssZ
          type: string
          description: Date and time when the export job expired.
          format: date-time
          nullable: true
        expiresIn:
          type: integer
          description: The time in seconds when the job will expire; calculated since
            the last action. The last time an action was taken on the job is reflected
            in the `lastUpdatedAt` attribute.
          format: int32
        failureReason:
          type: string
          description: Reason why the job failed in the case of a failure.
          nullable: true
        failureReasonType:
          type: string
          description: This can be one of ExportJobFailureReasonType values
          example: invalid_configuration
        id:
          type: string
          description: The unique identifier generated by Pleo for the export job.
          format: uuid
        isInteractive:
          type: boolean
          description: Indicates whether the export job was initiated by a user or
            by the system.
        lastUpdatedAt:
          pattern: YYYY-MM-DDTHH:mi:ssZ
          type: string
          description: Last time the job was updated or action on the job was taken.
          format: date-time
          nullable: true
        numberOfItems:
          type: integer
          description: Number of accounting entries that were selected for processing.
        startedAt:
          pattern: YYYY-MM-DDTHH:mi:ssZ
          type: string
          description: Date and time when the export job was started - this indicates
            the time when the export job event was triggered to change the status
            of the export job to in_progress.
          format: date-time
          nullable: true
        status:
          type: string
          description: This can be one of ExportJobStatus values
          example: pending
        vendorBasedBookkeeping:
          type: boolean
          description: When enabled, the export items would include vendor and bookkeeping
            data
    InvoiceInformation:
      required:
      - invoiceDate
