    CsvRowImportErrorV1:
      required:
      - createdAt
      - csvImportJobId
      - errorCode
      - errorMessage
      - id
      - rawData
      - rowNumber
      type: object
      properties:
        createdAt:
          type: string
          description: Timestamp when the error was recorded.
          format: date-time
        csvImportJobId:
          type: string
          description: Unique identifier for the import job.
          format: uuid
        errorCode:
          type: string
          description: Code representing the type of error.
          example: INVALID_VAT_NUMBER
        errorMessage:
          type: string
          description: Description of the error.
          example: Invalid VAT number format
        id:
          type: string
          description: Unique identifier for the error.
          format: uuid
        rawData:
          type: string
          description: Raw CSV row data as JSON string.
          example: '''"70001","Müller GmbH","INVALID"'''
        rowNumber:
          type: integer
          description: Row number in the CSV file where the error occurred.
          format: int32
          example: 42
