          type: string
          description: The external id of the account specified for this accounting
            entry.
          format: uuid
        family:
          type: string
          description: 'This can be one of `AccountingEntryFamily` values.


            `BALANCE_AMENDMENT`: Represents manual wallet balance adjustments, often
            through human intervention.

            `BILL_INVOICE`: Represents an invoice issued to the company. If payment
            of the invoice is made via Pleo, the payment is recorded separately, using
            the `BILL_INVOICE_PAYMENT` family.

            `CARD_PURCHASE`: Represents a purchase made using a physical or virtual
            Pleo card.

            `CASHBACK`: An amount of money that is returned to the company through
            Pleo cashback.

            `CREDIT_NOTE`: Represents a credit note issued to the company, stored
            only in the accounting entry metadata table.

            `MILEAGE`: Represents a Mileage expense incurred by an employee. The amount
            is owed to the employee.

            `OUT_OF_POCKET`: Represents an amount that is spent by an employee out
            of their own pocket. The amount is owed to the employee.

            `OVERDRAFT`: Represents either the monthly subscription fee for using
            Pleo Overdraft, or a the interest incurred on an existing overdraft.

            `PER_DIEM`: Represents a daily allowance given to an employee during travel
            - the amount is owed to the employee.

            `PLEO_INVOICE`: Represents the SaaS invoice from Pleo to the company.

            `REIMBURSEMENT`: Represents a reimbursement from the company to the employee
            or vice-versa.

            `WALLET`: Represents a top up or withdrawal on the Pleo wallet

            `BILL_INVOICE_PAYMENT`: Represents a payment of an invoice from the company
            wallet.

            '
          example: BALANCE_AMENDMENT
        fees:
