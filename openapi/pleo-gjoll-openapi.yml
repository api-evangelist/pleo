    ExportStatus:
      type: string
      description: '`CREATED`: The accounting entry has been created.

        `EXPORTED`: The accounting entry has been exported.

        `EXPORTING`: The accounting entry is in the process of being exported.

        `QUEUED`: The accounting entry is in the queue to be exported.

        '
      enum:
      - CREATED
      - EXPORTED
      - EXPORTING
      - NOT_CREATED
      - NOT_EXPORTED
      - QUEUED
    Money:
      required:
      - currency
      - minors
      type: object
      properties:
        currency:
          type: string
          description: The currency codes followed in Pleo conforms with ISO 4217.
          example: EUR
        minors:
          type: integer
          description: "The transaction amount is represented in smallest denomination\
            \ in a specific currency.\n For example:\n- A transaction amount is £65.80\
            \ in Great Britain Pounds (GBP); this represented as `6580`.\n- A transaction\
            \ amount is 1500 ISK in Icelandic Króna (ISK); this is represented as\
            \ `1500`."
          format: int64
          example: 10
    PageOrder:
      type: string
      enum:
      - ASC
      - ASC_NULLS_FIRST
      - ASC_NULLS_LAST
      - DESC
      - DESC_NULLS_FIRST
      - DESC_NULLS_LAST
    ReceiptFileType:
      type: string
      description: '`ORIGINAL`: The original file as it was uploaded.

        `THUMBNAIL`: Representation of the original file in a small image.

        `PREVIEW`: Display of the original file in a concise format.

        '
      enum:
      - EMBED
      - ORIGINAL
      - THUMBNAIL
      - PREVIEW
    ReceiptMimeType:
      type: string
      description: '`unknown`: The MIME type of the file is unknown.

        `application/pdf`: The receipt file is a PDF file.

        `application/postscript`: The receipt file is a PostScript file.

        `application/xml`: The receipt file is a xml e-invoice.

        `image/jpeg`: The receipt file is a JPEG image.

        `image/png`: The receipt file is a PNG image.

        `image/heic`: The receipt file is a HEIC image.

        `image/heif`: The receipt file is a HEIF image.

        `image/gif`: The receipt file is a GIF image.

        `text/xml`: The receipt file is a xml e-invoice.

        '
      enum:
      - unknown
      - application/pdf
      - application/postscript
      - application/xml
      - image/jpeg
      - image/png
      - image/heic
      - image/heif
      - image/gif
      - text/xml
    ReceiptModel:
      required:
      - accountingEntryId
      - createdAt
      - fileType
      - id
      - mimeType
      - sizeInBytes
      - source
      - url
      type: object
      properties:
        accountingEntryId:
          type: string
          description: The ID of accounting entry that this receipt belongs to.
          format: uuid
        createdAt:
          type: string
          description: The time when the receipt was uploaded.
          format: date-time
        fileType:
          type: string
          description: 'This can be one of `ReceiptFileType` values.


            `ORIGINAL`: The original file as it was uploaded.

            `THUMBNAIL`: Representation of the original file in a small image.

            `PREVIEW`: Display of the original file in a concise format.

            '
          example: EMBED
        id:
          type: string
          description: The ID of the receipt.
          format: uuid
        mimeType:
          type: string
          description: 'This can be one of `ReceiptMimeType` values.


            `unknown`: The MIME type of the file is unknown.

            `application/pdf`: The receipt file is a PDF file.

            `application/postscript`: The receipt file is a PostScript file.

            `application/xml`: The receipt file is a xml e-invoice.

            `image/jpeg`: The receipt file is a JPEG image.

            `image/png`: The receipt file is a PNG image.

            `image/heic`: The receipt file is a HEIC image.

            `image/heif`: The receipt file is a HEIF image.

            `image/gif`: The receipt file is a GIF image.

            `text/xml`: The receipt file is a xml e-invoice.

            '
          example: unknown
        ocrDocumentId:
          type: string
          description: The ID of the OCR document that might be linked to this receipt.
          format: uuid
        sizeInBytes:
          type: integer
          description: The size of the file in bytes.
          format: int32
        source:
          type: string
          description: 'This can be one of `ReceiptSource` values.


            `APP_SHARE`: The receipt was uploaded via the share to Pleo mobile app
            function.

            `BOLT`: The receipt was retrieved from Bolt mobile app.

            `CAMERA`: The receipt was uploaded via the camera in the Pleo mobile app.

            `CASHBACK`: The receipt was generated by the Cashback feature.

            `EMAIL_FETCHING`: The receipt was automatically fetched via Pleo Fetch.

            `EMAIL_FETCHING_BATCHED`: The receipt was automatically fetch via Pleo
            Fetch in a batch.

            `EMAIL_FORWARDING`: The receipt was forwarded to Pleo via email.

            `GENERATED_RECEIPT`: The receipt was generated by internal systems.

            `LOST_RECEIPT`: The receipt was generated by the Lost Receipt feature.

            `ROGER`: The receipt was automatically fetched via the Roger integration

            `STOREBOX`: The receipt was uploaded via the Storebox integration.

            `STRIPE`: The receipt was uploaded via the Stripe integration.

            `TRAVELPERK`: The receipt was uploaded via the TravelPerk integration.

            `USER`: The receipt was uploaded by the user.

            '
          example: APP_SHARE
        url:
          type: string
          description: A URL with an expiry period of 24 hours for accessing the receipt
            file.
          format: url
    ReceiptSearchRequest:
      required:
      - includeDeleted
      type: object
      properties:
        accountingEntryIds:
          type: array
          description: 'Only return receipts for the given accounting entry ID. '
          items:
            type: string
            description: 'Only return receipts for the given accounting entry ID. '
            format: uuid
        employeeIds:
          type: array
          description: 'Only return receipts for the given Employee ID. '
          items:
            type: string
            description: 'Only return receipts for the given Employee ID. '
            format: uuid
        fileType:
          $ref: '#/components/schemas/ReceiptFileType'
        includeDeleted:
          type: boolean
          description: Include deleted receipts
          default: false
        mimeType:
          type: array
          description: Only return receipts with the given mime type. Useful for fetching
            a list of receipts uploaded with particular mime types.
          items:
            $ref: '#/components/schemas/ReceiptMimeType'
        source:
          type: array
          description: Only return receipts that are uploaded from the specific source.
            Useful for fetching a list of receipts uploaded via particular sources.
          items:
            $ref: '#/components/schemas/ReceiptSource'
    ReceiptSource:
      type: string
      description: '`APP_SHARE`: The receipt was uploaded via the share to Pleo mobile
        app function.

        `BOLT`: The receipt was retrieved from Bolt mobile app.

        `CAMERA`: The receipt was uploaded via the camera in the Pleo mobile app.

        `CASHBACK`: The receipt was generated by the Cashback feature.

        `EMAIL_FETCHING`: The receipt was automatically fetched via Pleo Fetch.

        `EMAIL_FETCHING_BATCHED`: The receipt was automatically fetch via Pleo Fetch
        in a batch.

        `EMAIL_FORWARDING`: The receipt was forwarded to Pleo via email.

        `GENERATED_RECEIPT`: The receipt was generated by internal systems.

        `LOST_RECEIPT`: The receipt was generated by the Lost Receipt feature.

        `ROGER`: The receipt was automatically fetched via the Roger integration

        `STOREBOX`: The receipt was uploaded via the Storebox integration.

        `STRIPE`: The receipt was uploaded via the Stripe integration.

        `TRAVELPERK`: The receipt was uploaded via the TravelPerk integration.

        `USER`: The receipt was uploaded by the user.

        '
      enum:
      - APP_SHARE
      - BOLT
      - CAMERA
      - CASHBACK
      - EMAIL_FETCHING
      - EMAIL_FETCHING_BATCHED
      - EMAIL_FORWARDING
      - GENERATED_RECEIPT
      - LOST_RECEIPT
      - ROGER
      - STOREBOX
      - STRIPE
      - TRAVELPERK
      - USER
    ReceiptsSortingKeys:
      type: string
      enum:
      - createdAt
      - id
      - size
    ReviewStatus:
      type: string
      description: '`NOT_OK`: The accounting entry has been reviewed as `Not OK`.

        `NOT_REQUIRED`: The accounting entry does not require review.

        `NOT_SET`: The accounting entry has not been reviewed yet.

        `OK`: The accounting entry has been reviewed as `OK`.

        `WAITING_FOR_EXPENSE_OWNER`: The accounting entry is waiting for more details
        from the Expense Owner.

        `WAITING_FOR_REVIEWER`: The accounting entry is waiting for review by a reviewer.

        `WAITING_FOR_COMPANY_REVIEWER`: The accounting entry is waiting for review
        by a company reviewer.

        `WAITING_FOR_TEAM_REVIEWER`: The accounting entry is waiting for review by
        a team reviewer.

        `WAITING_FOR_TAG_REVIEWER`: The accounting entry is waiting for review by
        a tag reviewer.

        '
      enum:
      - NOT_OK
      - NOT_REQUIRED
      - NOT_SET
      - OK
      - WAITING_FOR_EXPENSE_OWNER
      - WAITING_FOR_REVIEWER
      - WAITING_FOR_COMPANY_REVIEWER
      - WAITING_FOR_TEAM_REVIEWER
      - WAITING_FOR_TAG_REVIEWER
