          format: date-time
    AccountingEntryFamily:
      type: string
      description: '`BALANCE_AMENDMENT`: Represents manual wallet balance adjustments,
        often through human intervention.

        `BILL_INVOICE`: Represents an invoice issued to the company. If payment of
        the invoice is made via Pleo, the payment is recorded separately, using the
        `BILL_INVOICE_PAYMENT` family.

        `CARD_PURCHASE`: Represents a purchase made using a physical or virtual Pleo
        card.

        `CASHBACK`: An amount of money that is returned to the company through Pleo
        cashback.

        `CREDIT_NOTE`: Represents a credit note issued to the company, stored only
        in the accounting entry metadata table.

        `MILEAGE`: Represents a Mileage expense incurred by an employee. The amount
        is owed to the employee.

        `OUT_OF_POCKET`: Represents an amount that is spent by an employee out of
        their own pocket. The amount is owed to the employee.

        `OVERDRAFT`: Represents either the monthly subscription fee for using Pleo
        Overdraft, or a the interest incurred on an existing overdraft.

        `PER_DIEM`: Represents a daily allowance given to an employee during travel
        - the amount is owed to the employee.

        `PLEO_INVOICE`: Represents the SaaS invoice from Pleo to the company.

        `REIMBURSEMENT`: Represents a reimbursement from the company to the employee
        or vice-versa.

        `WALLET`: Represents a top up or withdrawal on the Pleo wallet

        `BILL_INVOICE_PAYMENT`: Represents a payment of an invoice from the company
        wallet.

        '
      enum:
      - BALANCE_AMENDMENT
      - BILL_INVOICE
      - CARD_PURCHASE
      - CASHBACK
      - CREDIT_NOTE
      - MILEAGE
      - OUT_OF_POCKET
      - OVERDRAFT
      - PER_DIEM
      - PLEO_INVOICE
      - REIMBURSEMENT
      - WALLET
      - BILL_INVOICE_PAYMENT
    AccountingEntryStatus:
      type: string
      description: "`DRAFT`: The accounting entry is still in a work-in-progress stage;\
        \ the details might change.\n`PENDING`: Payment is in progress. The transaction\
        \ amount in the specific currency is final, yet the funds have not\n  yet\
        \ been settled.> ⚠️ **Note**: The customer can no longer cancel this expense.\n\
        > amount/currency is fixed, funds have been reserved but not yet settled,\n\
        > and expense can no longer be canceled by user\n`COMPLETED`: The transaction\
        \ is complete, implying the funds have been settled for the final bill amount.\n\
        `COMPLETED_EXTERNALLY`: Payment has completed *outside of Pleo*. Hence, it\
        \ does not impact the Pleo wallet\n`CANCELLED`: Canceled by user, Pleo, or\
        \ an external party\n`REJECTED`: Rejected by user, Pleo or an external party\n\
        `ERROR`: An error prevented the accounting entry from being settled\n"
      enum:
      - DRAFT
      - PENDING
      - COMPLETED
      - COMPLETED_EXTERNALLY
      - CANCELLED
      - REJECTED
      - ERROR
