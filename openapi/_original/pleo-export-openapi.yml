    Tag:
      required:
      - code
      - groupCode
      type: object
      properties:
        code:
          type: string
          description: This is the identifier to the specific cost allocation item.
            e.g. the specific project, department, etc.
        groupCode:
          type: string
          description: Allocation grouping, e.g. project, cost center, department
            or if the if dimensions are being used, this would be the dimension group
            identifier.
      description: Tags are used to appropriate funds to specific projects, cost centers,
        departments, etc. This is what is known as "tags" in Pleo.
      nullable: true
    TagV1:
      required:
      - code
      - groupCode
      - id
      type: object
      properties:
        code:
          type: string
          description: This is the identifier to the specific cost allocation item.
            e.g. the specific project, department, etc.
        groupCode:
          type: string
          description: Allocation grouping, e.g. project, cost center, department
            or if the if dimensions are being used, this would be the dimension group
            identifier.
        id:
          type: string
          description: This is the Pleo internal identifier of the tag.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      description: Tags are used to appropriate funds to specific projects, cost centers,
        departments, etc. This is what is known as "tags" in Pleo.
      nullable: true
    TagV2:
      required:
      - code
      - groupCode
      - id
      type: object
      properties:
        code:
          type: string
          description: This is the unique identifier of the tag allocated to the export
            item.
        groupCode:
          type: string
          description: This is the unique identifier of the tag group (a tag group
            is a collection of tags).
        id:
          type: string
          description: This is the Pleo internal identifier of the tag.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      description: Tags are cost centres allocated to an export item.
      nullable: true
    TagV3:
      required:
      - code
      - groupCode
      - id
      type: object
      properties:
        code:
          type: string
          description: Unique identifier of the tag allocated to the export item.
        groupCode:
          type: string
          description: Unique identifier of the tag group (a tag group is a collection
            of tags).
        id:
          type: string
          description: Pleo internal identifier of the tag.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      description: Tags are cost centres allocated to an export item.
      nullable: true
    Tax:
      required:
      - amount
      - rate
      - type
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/ExportItemAmount'
        code:
          type: string
          description: Tax code.
          nullable: true
        rate:
          type: number
          description: Tax rate. This is represented in decimals and not the percentage.
            e.g. 20% tax rate would be 0.20.
          example: 0.2
        type:
          type: string
          enum:
          - inclusive
          - exclusive
          - reverse
      description: Tax details applicable to this accounting entry line. The tax details
        would usually either have the code or the identifier or both.
      nullable: true
    TaxAmountV3:
      required:
      - inSupplierCurrency
      - inWalletCurrency
      type: object
      properties:
        inSupplierCurrency:
          $ref: '#/components/schemas/MoneyModel'
        inWalletCurrency:
          $ref: '#/components/schemas/MoneyModel'
      description: Amount spent for tax.
    TaxTypeV3:
      type: string
      description: '

        | Value  | Description |

        | ------ | ----------- |

        | inclusive | If the tax code type is inclusive, the net bill amount is the
        amount including tax and the gross bill amount is excluding tax. |

        | exclusive | If the tax code type is exclusive, the net bill amount is the
        amount excluding tax and the gross bill amount is including tax. |

        | reverse | Specifies whether the export item follows the EU reverse charge
        tax mechanism. |'
      enum:
      - inclusive
      - exclusive
      - reverse
    TaxV1:
      required:
      - amount
      - id
      - rate
      - type
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/ExportItemAmount'
        code:
          type: string
          description: Tax code
          nullable: true
        id:
          type: string
          description: This is the Pleo internal identifier of the tax code.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        rate:
