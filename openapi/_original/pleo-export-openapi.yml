        the invoice would be represented here.
      nullable: true
    InvoiceInformationStatusV3:
      type: string
      description: '

        | Value  | Description |

        | ------ | ----------- |

        | pending_approval | Invoice is awaiting review by user (owner). |

        | parsed | Invoice parsing results have been processed; next status is being
        determined. |

        | preparing | Funds request sent and payment not yet initiated. |

        | prepared | Funds were frozen successfully but payment not yet initiated.
        |

        | ready | Invoice is ready to be scheduled for payment. |

        | rejected_by_approver | Approver rejected the invoice. |

        | marked_as_paid | User indicates the invoice has been paid outside of Pleo.
        |

        | scheduled | Invoice is scheduled for payment. |

        | payment_in_progress | Payment is in progress. |

        | paid | Invoice has been paid, payment was confirmed. |

        | voided_by_user | User indicates invoice does not need to be processed; can
        only be used before the READY state. |

        | rejected_by_user | User can void an invoice even after approval. |

        | failed_payment | Invoice payment has been returned as failed. |'
      enum:
      - pending_approval
      - parsed
      - preparing
      - prepared
      - ready
      - rejected_by_approver
      - marked_as_paid
      - scheduled
      - payment_in_progress
      - paid
      - voided_by_user
      - rejected_by_user
      - failed_payment
