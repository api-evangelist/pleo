    CsvFormatV1:
      required:
      - delimiter
      - ignoreEmptyLines
      - recordSeparator
      - skipHeaderRecord
      type: object
      properties:
        delimiter:
          type: string
          description: Values delimiter.
          example: ','
        escapeCharacter:
          type: string
          description: Character used for escaping special characters.
          example: \
        ignoreEmptyLines:
          type: boolean
          description: Whether to ignore empty lines in the CSV file.
          example: true
        quoteCharacter:
          type: string
          description: Character used for quoting values.
          example: '"'
        recordSeparator:
          type: string
          description: Record separator.
          example: ''
        skipHeaderRecord:
          type: boolean
          description: Whether to skip the first record as a header.
          example: true
      description: CSV format configuration including delimiter, quote character, and other parsing options. If not provided for a CSV import job, the parser will try to guess it based on the actual data in the file.
      example:
        delimiter: ','
        quoteCharacter: '"'
        escapeCharacter: \
        recordSeparator: '

          '
        ignoreEmptyLines: true
        skipHeaderRecord: true
