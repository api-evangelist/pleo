            accounting system. Also known in Pleo as the book ID.
      description: Additional metadata applicable to this accounting entry.
    ExportItemNetAmountV3:
      required:
      - inSupplierCurrency
      - inWalletCurrency
      type: object
      properties:
        inSupplierCurrency:
          $ref: '#/components/schemas/MoneyModel'
        inWalletCurrency:
          $ref: '#/components/schemas/MoneyModel'
      description: Amount either including or excluding tax. This depends on the tax
        code, represented in the tax type attribute.
    ExportItemSubTypeV3:
      type: string
      description: '

        | Value  | Description |

        | ------ | ----------- |

        | reimbursement_to_employee_refund | Return of a reimbursement to an employee
        that bounced and/or failed, reversing the original reimbursement transaction.
        |

        | reimbursement_to_company | Reimbursement paid to the company, typically
        when an employee returns funds or makes an accidental purchase with a Pleo
        card. |

        | reimbursement_to_employee | Reimbursement paid to an employee for expenses
        made out of pocket, either through direct transfer or external payment method.
        |

        | invoice_payment_returned | Invoice payment that was returned or reversed,
        typically due to payment failure or cancellation after the payment was initially
        processed. |

        | invoice_payment_sent | Invoice payment that was successfully sent, confirming
        the payment for an invoice. |

        | interest | Interest charged as a fee, typically for overdraft usage. |'
      enum:
      - reimbursement_to_employee_refund
      - reimbursement_to_company
      - reimbursement_to_employee
      - invoice_payment_returned
      - invoice_payment_sent
      - interest
    ExportItemTypeV3:
      type: string
      description: '

        | Value  | Description |

        | ------ | ----------- |

        | card_purchase | An expense made using Pleo cards. |

        | card_invoice | An invoice paid using a card containing details of an invoice
        number, amounts, supplier information, and taxes. |

        | out_of_pocket | An expense made by an employee using their personal funds,
        for which they need to be reimbursed. |

        | mileage | An allowance which a company can pay out to employees for driving
        their own car on business trips. |

        | per_diem | A daily travel allowance for business travel. |

        | external_reimbursement | Refund, through cash or payroll, to an employee
        for an expense made using their personal funds. This is handled outside of
        Pleo and does not affect the Pleo Wallet balance. |

        | direct_reimbursement | Refund, by directly transferring funds from the Pleo
        Wallet, to an employee’s personal card or bank account for an expense made
        using their personal funds. |

        | invoice | Invoice document with details of invoice number, amounts, supplier
        information, and taxes. |

        | invoice_payment | Information about the payment made for an invoice. |

        | chargeback | Return of funds for a previous card expense, usually as a result
        of a dispute. |

        | refund | Refund on a spend from the supplier. |

        | cashback | Cashback offered by Pleo, a way to reward customers for spending
        on Pleo. |

        | atm_withdrawal | Cash withdrawn from an ATM. |

        | wallet_topup | Transferring funds to the Pleo wallet from your company''s
        bank account. |

        | wallet_unload | Withdrawing funds from the Pleo wallet to your company''s
        bank account. |

        | personal_spend | An expense made by an employee using their card for personal
        reasons. |

        | fee | Any fees charged to the customer, including forex fees, overdraft
        fees, and interest. |'
      enum:
      - card_purchase
      - card_invoice
      - out_of_pocket
      - mileage
      - per_diem
      - external_reimbursement
      - direct_reimbursement
      - invoice
      - invoice_payment
      - chargeback
      - refund
      - cashback
      - atm_withdrawal
      - wallet_topup
      - wallet_unload
      - personal_spend
      - fee
