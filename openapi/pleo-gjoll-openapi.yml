        totalBillValue:
          description: 'The total amount that is either debited or credited from the
            Pleo wallet of the company.

            - Could be more than the `transactionWalletValue` as in a card purchase,  payment
            processing fees are included.

            - `BILL_INVOICE` includes scheduled payments. They are included in the
            `totalBillValue`, yet they do not impact the actual Pleo wallet balance.'
