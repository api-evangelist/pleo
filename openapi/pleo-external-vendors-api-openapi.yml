          type: string
          description: Timestamp when the import job was created.
          format: date-time
        csvFormat:
          $ref: '#/components/schemas/CsvFormatV1'
        errorCode:
          type: string
          description: This can be one of CsvImportErrorTypeV1 values
          example: INVALID_FILE_FORMAT
        errorMessage:
          type: string
          description: Error message if status is FAILED.
          example: Uploaded file is not a valid CSV format.
        id:
          type: string
          description: Unique identifier for the import job.
          format: uuid
        metadata:
          type: object
          additionalProperties:
            type: object
            description: Place for API users to store flexible data. The value provided in this field will be passed to consuming service for every CSV row along with the parsed data.
          description: Place for API users to store flexible data. The value provided in this field will be passed to consuming service for every CSV row along with the parsed data.
        originalFilename:
          type: string
          description: Original filename of the uploaded CSV file.
          example: vendors.csv
        rowsFailed:
          type: integer
          description: Number of rows that failed processing.
          format: int32
          example: 50
        rowsSkipped:
          type: integer
          description: Number of rows that were skipped.
          format: int32
          example: 10
        rowsSucceeded:
          type: integer
          description: Number of rows successfully processed.
          format: int32
          example: 1450
        rowsTotal:
          type: integer
          description: Total number of rows in the CSV file.
          format: int32
          example: 1500
        s3Key:
          type: string
          description: S3 key where the uploaded CSV file is stored.
          example: uploads/company-123/vendors-abc.csv
        status:
          type: string
          description: This can be one of CsvImportJobStatusV1 values
          example: UPLOAD_INITIATED
        type:
          type: string
          description: Type of CSV import job.
          example: vendors
        updatedAt:
          type: string
          description: Timestamp when the import job was last updated.
          format: date-time
