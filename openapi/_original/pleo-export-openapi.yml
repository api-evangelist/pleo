          $ref: '#/components/schemas/TaxV1'
      description: Accounting entry broken down in entry lines. There will always
        be an accounting entry line. If the accounting entry has been split into separate
        lines, then each line would represent the details of that accounting entry
        line, else there would only be one line present, representing the whole entry.
