  schemas:
    CursorPaginatedResponseExportItemV2:
      required:
      - data
      - pagination
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExportItemV2'
        pagination:
          $ref: '#/components/schemas/CursorPageInfo'
    ExceptionInfo:
      required:
      - type
      type: object
      properties:
        message:
          type: string
        type:
          type: string
