    TagV2:
      required:
      - code
      - groupCode
      - id
      type: object
      properties:
        code:
          type: string
          description: This is the unique identifier of the tag allocated to the export item.
        groupCode:
          type: string
          description: This is the unique identifier of the tag group (a tag group is a collection of tags).
        id:
          type: string
          description: This is the Pleo internal identifier of the tag.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      description: Tags are cost centres allocated to an export item.
      nullable: true
    AccountV2:
      required:
      - id
      - name
      type: object
      properties:
        code:
          type: string
          description: The account code or number.
          nullable: true
        id:
          type: string
          description: This is the Pleo internal identifier of the account.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        identifier:
          type: string
          description: The internal account identifier in the accounting system.
          nullable: true
        name:
          type: string
          description: This is the name of the account as set on the Pleo UI.
          example: Meals and Entertainment
      description: This is the specific General Ledger (GL) account allocated to the export item - the account code, the identifier, or both are mentioned, if any GL account is allocated.
      nullable: true
    VendorV2:
      required:
      - defaultCurrency
      - id
      - name
      type: object
      properties:
        code:
          type: string
          description: Unique identifier assigned to the vendor in the target ERP/accounting system for aiding users in identifying the correct record.
        country:
          $ref: '#/components/schemas/CountryCode'
        defaultCurrency:
          maxLength: 3
          minLength: 3
          type: string
          description: Default currency in which the vendor’s financial operations, such as purchases, payments, or invoices, are primarily conducted. (ISO 4217 currency code (3 letters))
          example: DKK
        externalId:
          type: string
          description: Unique external identifier of the vendor, assigned by the target ERP/accounting system, used by the client for identification. Can be the same as code if no other identifier is available.
        id:
          type: string
          description: Pleo's internal identifier for the Vendor
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          description: The name field represents the official name of the Vendor as it is recorded in the target ERP/accounting system. This name is used to uniquely identify the vendor within the accounting workflow and is visible to the Pleo bookkeeper.
          example: Pleo
        registrationNumber:
          type: string
          description: Unique identification of a registered vendor in a country
        taxRegistrationNumber:
          type: string
          description: VAT/GST/TaxId number of the Vendor
      description: The vendor associated with the accounting entry.
    ExportItemLineV2:
      required:
      - accountingEntryLineId
      - lineAmount
      - netAmount
      type: object
      properties:
        account:
          $ref: '#/components/schemas/AccountV2'
        accountingEntryLineId:
          type: string
          description: This is the ID of the specific line.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        lineAmount:
          $ref: '#/components/schemas/ExportItemAmount'
        netAmount:
          $ref: '#/components/schemas/ExportItemAmount'
        tags:
