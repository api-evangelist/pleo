    ExportItemUserV2:
      required:
      - id
      - name
      type: object
      properties:
        code:
          type: string
          description: This would usually represent the employee code.
          nullable: true
        id:
          type: string
          description: This is the Pleo internal identifier of the user.
          format: uuid
          nullable: true
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          description: Full name of the user.
          example: John Doe
      description: This applies to the person that initiated the spend. In most cases this would be the employee.
      nullable: true
    CursorPageCurrentRequestInfo:
      required:
      - parameters
      type: object
      properties:
        after:
          type: string
        before:
          type: string
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        parameters:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        sortingKeys:
          type: array
          items:
            type: string
        sortingOrder:
          type: array
          items:
            $ref: '#/components/schemas/PageOrder'
    ExportItemV2:
      required:
      - _links
      - accountingEntryId
      - accountingEntryLines
      - additionalInformation
      - amount
      - companyId
      - date
      - type
      type: object
      properties:
        _links:
          $ref: '#/components/schemas/LinksResponse'
        accountingEntryId:
          type: string
          description: This is the Pleo internal identifier of the export item (identifier of the expense).
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        accountingEntryLines:
          type: array
          description: An accounting entry is represented with either a single line or multiple lines that explain the details. So, if the accounting entry is split into multiple lines, each line has a unique ID.
          items:
            $ref: '#/components/schemas/ExportItemLineV2'
        additionalInformation:
          $ref: '#/components/schemas/ExportItemAdditionalInformationV2'
        amount:
          $ref: '#/components/schemas/ExportItemAmount'
        bookkeeping:
          $ref: '#/components/schemas/BookkeepingV2'
        companyId:
          type: string
          description: Pleo company identifier this export item belongs to.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        date:
          pattern: YYYY-MM-DDTHH:mi:ssZ
          type: string
          description: The date when the export item was book kept.
          format: date-time
        files:
          type: array
          description: Files that have been attached to this accounting entry.
          nullable: true
          items:
            $ref: '#/components/schemas/ExportItemFile'
        note:
          type: string
          description: Additional comments potentially describing the accounting entry.
          nullable: true
        servicePeriod:
          $ref: '#/components/schemas/ServicePeriodV2'
        subType:
          type: string
          description: Optional subtype for the export item, providing additional categorisation within the main type.
          nullable: true
        supplier:
          $ref: '#/components/schemas/SupplierV2'
        team:
          $ref: '#/components/schemas/TeamV2'
        teamCode:
          type: string
          description: Team code is an identifier assigned to an expense to categorize it or associate it with a specific team.
          nullable: true
        type:
          type: string
          description: This is the Pleo internal identifier assigned to the export item, based on the type of expense it is. For example, a specific identifier is assigned to a card_purchase accounting entry.
          enum:
          - card_purchase
          - card_invoice
          - out_of_pocket
          - mileage
          - per_diem
          - external_reimbursement
          - direct_reimbursement
          - invoice
          - invoice_payment
          - chargeback
          - refund
          - cashback
          - atm_withdrawal
          - wallet_topup
          - wallet_unload
          - personal_spend
          - fee
        user:
          $ref: '#/components/schemas/ExportItemUserV2'
        vendor:
          $ref: '#/components/schemas/VendorV2'
    TeamV2:
      required:
      - id
      - name
      type: object
      properties:
        code:
          type: string
          description: Team code, usually the unique identifier of the team in the accounting system.
          nullable: true
        id:
          type: string
          description: This is the Pleo internal identifier of the team.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          description: This is the name of the team.
          example: Marketing
      description: Teams are assigned to an export item for categorisation or association with a specific team.
      nullable: true
    LinksResponse:
      type: object
      properties:
        api:
          type: object
          additionalProperties:
            type: string
        mobile:
          type: object
          additionalProperties:
            type: string
        web:
          type: object
          additionalProperties:
            type: string
      description: Contains links relevant to the export item.
      example:
        web:
          exportItem: https://example.com
        mobile:
          exportItem: https://example.com
        api:
          exportItem: https://example.com
    ExportItemFile:
      required:
      - size
      - type
      - url
      type: object
      properties:
        size:
          type: integer
          description: Size of the file in bytes.
          format: int32
          example: 2084
        type:
          type: string
          description: Type of file, usually represented similar to mime type.
          example: application/pdf
        url:
          type: string
          description: URL to retrieve the file attachment from. This URL is active for a limited time (24 Hours) from the time the export item is fetched.
          example: https://file.url
      description: Files that have been attached to this accounting entry.
      nullable: true
    InvoiceInformationV2:
      required:
      - invoiceDate
      - invoiceNumber
      - status
      type: object
      properties:
        dueDate:
          pattern: YYYY-MM-DD
          type: string
          description: Date the payment is due.
          format: date-time
          nullable: true
        invoiceDate:
          pattern: YYYY-MM-DD
          type: string
          description: Date the invoice was issued.
          format: date-time
        invoiceNumber:
          type: string
          description: The invoice number.
        paymentDate:
          pattern: YYYY-MM-DD
          type: string
          description: Date the invoice was paid if the status is paid.
          format: date-time
          nullable: true
        status:
          type: string
          description: The invoice status.
          enum:
          - pending_approval
          - parsed
          - preparing
          - prepared
          - ready
          - rejected_by_approver
          - marked_as_paid
          - scheduled
          - payment_in_progress
          - paid
          - voided_by_user
          - rejected_by_user
          - failed_payment
        supplierBankAccount:
          $ref: '#/components/schemas/SupplierBankAccount'
      description: For an invoice, additional information related to the invoice is specified in this attribute.
      nullable: true
    CursorPageInfo:
      required:
      - currentRequestPagination
      - hasNextPage
      - hasPreviousPage
      type: object
      properties:
        currentRequestPagination:
          $ref: '#/components/schemas/CursorPageCurrentRequestInfo'
        endCursor:
          type: string
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
        startCursor:
          type: string
        total:
          type: integer
          format: int64
    BookkeepingV2:
      required:
      - method
      type: object
      properties:
        method:
          $ref: '#/components/schemas/BookkeepingMethodV2'
      description: Bookkeeping related configurations for an accounting entry.
      nullable: true
    BookkeepingMethodV2:
      type: string
      description: Specifies the type of bookkeeping system used for recording the accounting entry.
      enum:
      - none
      - journal
      - accounts_payable
    ExportItemAmount:
      required:
      - inSupplierCurrency
      - inWalletCurrency
      type: object
      properties:
        inSupplierCurrency:
          $ref: '#/components/schemas/MoneyModel'
        inWalletCurrency:
          $ref: '#/components/schemas/MoneyModel'
      description: Export item amount.
    ServicePeriodV2:
      required:
      - from
      - to
      type: object
      properties:
        from:
          pattern: yyyy-MM-dd'T'HH:mm:ss'Z'
          type: string
          description: The start of the service period in ISO 8601 datetime format.
          format: date-time
          example: '2025-01-01T00:00:00Z'
        to:
          pattern: yyyy-MM-dd'T'HH:mm:ss'Z'
          type: string
          description: The end of the service period in ISO 8601 datetime format.
          format: date-time
