          example: '4113617'
        reviewStatus:
          type: string
          description: 'This can be one of `ReviewStatus` values.


            `NOT_OK`: The accounting entry has been reviewed as `Not OK`.

            `NOT_REQUIRED`: The accounting entry does not require review.

            `NOT_SET`: The accounting entry has not been reviewed yet.

            `OK`: The accounting entry has been reviewed as `OK`.

            `WAITING_FOR_EXPENSE_OWNER`: The accounting entry is waiting for more
            details from the Expense Owner.

            `WAITING_FOR_REVIEWER`: The accounting entry is waiting for review by
            a reviewer.

            `WAITING_FOR_COMPANY_REVIEWER`: The accounting entry is waiting for review
            by a company reviewer.

            `WAITING_FOR_TEAM_REVIEWER`: The accounting entry is waiting for review
            by a team reviewer.

            `WAITING_FOR_TAG_REVIEWER`: The accounting entry is waiting for review
            by a tag reviewer.

            '
          example: NOT_OK
        settledAt:
          type: string
          description: The date and time when the transaction was settled. For example
            in the case of a card purchase, the date when the transaction was finalized.
          format: date-time
        spendTransactionIds:
          uniqueItems: true
          type: array
          description: A list of IDs of spend transactions associated with the specific
            accounting entry.
          items:
            type: string
            description: A list of IDs of spend transactions associated with the specific
              accounting entry.
            format: uuid
        status:
          type: string
          description: "This can be one of `AccountingEntryStatus` values.\n\n`DRAFT`:\
            \ The accounting entry is still in a work-in-progress stage; the details\
            \ might change.\n`PENDING`: Payment is in progress. The transaction amount\
            \ in the specific currency is final, yet the funds have not\n  yet been\
            \ settled.> ⚠️ **Note**: The customer can no longer cancel this expense.\n\
            > amount/currency is fixed, funds have been reserved but not yet settled,\n\
            > and expense can no longer be canceled by user\n`COMPLETED`: The transaction\
            \ is complete, implying the funds have been settled for the final bill\
            \ amount.\n`COMPLETED_EXTERNALLY`: Payment has completed *outside of Pleo*.\
            \ Hence, it does not impact the Pleo wallet\n`CANCELLED`: Canceled by\
            \ user, Pleo, or an external party\n`REJECTED`: Rejected by user, Pleo\
            \ or an external party\n`ERROR`: An error prevented the accounting entry\
            \ from being settled\n"
          example: DRAFT
        subFamily:
          type: string
          description: 'This can be one of `AccountingEntrySubFamily` values.


            `ATM`: A `CARD_PURCHASE` that was performed at an ATM.

            `IN_STORE`: A `CARD_PURCHASE` that was performed at a physical store.

            `ONLINE`: A `CARD_PURCHASE` that was performed online.

            `PLEO_INVOICE`: A `PLEO_INVOICE` that was paid.

            `PLEO_INVOICE_REFUND`: A `PLEO_INVOICE` that was refunded.

            `REIMBURSEMENT_TO_COMPANY`: A `REIMBURSEMENT` was made to the company.

            `REIMBURSEMENT_TO_EMPLOYEE`: A `REIMBURSEMENT` was made to the employee.

            `REIMBURSEMENT_TO_EMPLOYEE_REFUND`: A `REIMBURSEMENT` to the employee
            was refunded.

            `LOAD`: Either a `WALLET` or a BALANCE_AMENDMENT` load.

            `UNLOAD`: Either a `WALLET` or a BALANCE_AMENDMENT` unload - Money leaves
            the Pleo wallet.

            `WITHDRAWAL`: A `WALLET` withdrawal.

            `FEE`: A monthly fee paid for using overdraft.

            `INTEREST`: Interest paid for the amount over drafted.

            `BILL_INVOICE_PAYMENT_RETURNED`: A `BILL_INVOICE_PAYMENT` that was returned.

            `BILL_INVOICE_PAYMENT_RECEIVED`: A `BILL_INVOICE_PAYMENT` that was received.

            '
          example: ATM
        supplier:
          $ref: '#/components/schemas/AccountingEntrySupplier'
